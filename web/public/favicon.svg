<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="doodle-assistant">
  <title>doodle-assistant</title>
  <!-- Rounded square badge, then a doodled stroke with the "boil" wobble the app
       is about: the line never reads as a ruler-straight vector. -->
  <rect width="64" height="64" rx="14" fill="#1b5fbf" />
  <path
    d="M13 41c5-13 9-14 13-5s7 11 11-1 7-11 11-3"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="51" cy="18" r="4.5" fill="#ffd166" />
</svg>
